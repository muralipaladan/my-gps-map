<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sodestus — Pro Georeference & Tracing</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="show-ui">

<div id="splash">
  <p class="splash-logo">Sodestus <span>GIS</span></p>
  <div class="spin-ring"></div>
  <p class="splash-sub">Loading map engine…</p>
</div>

<!-- Status Ribbon -->
<div id="statusRibbon" class="status-ribbon">
  <div class="indicator" id="ribbonIndicator"></div>
  <span id="ribbonText">Hybrid</span>
</div>

<div id="map"></div>
<div id="zoomBox"></div>

<div class="searchbar collapsed" id="searchBar">
  <button id="searchToggleBtn" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
  <input type="text" id="searchInput" placeholder="Search place or lat, lng…" autocomplete="off" />
  <span id="searchPhoneInfo" style="display:flex;align-items:center;gap:5px;flex-shrink:0;padding:0 4px;border-left:1px solid var(--border);margin-left:2px;">
    <i class="fa-solid fa-phone" style="color:var(--accent);font-size:11px;"></i>
    <span style="font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:500;white-space:nowrap;">9400849115</span>
  </span>
  <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
</div>

<div class="side-dock">
  <button class="rb" id="gpsBtn" data-tip="Live GPS" onclick="GIS.GPS.toggle()"><i class="fa-solid fa-crosshairs"></i></button>
  <button class="rb" id="menuToggleBtn" data-tip="Tools Menu" onclick="GIS.UI.toggleMenu()"><i class="fa-solid fa-bars"></i></button>
</div>

<div class="panel-backdrop" id="panelBackdrop" onclick="GIS.UI.toggleMenu(false)"></div>

<div class="side-panel" id="sidePanel">
  <div class="panel-header">
    <span class="panel-title">Sodestus <span>Tools</span></span>
    <button class="panel-close" onclick="GIS.UI.toggleMenu(false)"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div class="panel-body">

    <!-- LAYER TAB -->
    <div class="tool-cat" id="cat-layers">
      <button class="cat-head" onclick="GIS.UI.toggleCat('layers')">
        <span class="cat-icon"><i class="fa-solid fa-layer-group"></i></span>
        <span class="cat-label">Layers</span>
        <i class="fa-solid fa-chevron-down cat-chev"></i>
      </button>
      <div class="cat-body">
        <div class="cat-hint">Basemap</div>
        <button class="mb" title="Hybrid"        onclick="GIS.Layers.setBase('hybrid')" style="font-size:9px;font-weight:800;letter-spacing:.5px">HYB</button>
        <button class="mb" title="Road"          onclick="GIS.Layers.setBase('road')"   style="font-size:9px;font-weight:800;letter-spacing:.5px">ROAD</button>
        <button class="mb" title="OpenStreetMap" onclick="GIS.Layers.setBase('osm')"    style="font-size:9px;font-weight:800;letter-spacing:.5px">OSM</button>
        <div class="cat-divider"></div>
        <div class="cat-hint">Cadastral WMS</div>
        <button class="mb" id="btnVil" title="Village WMS"    onclick="GIS.Layers.toggleWms('village')"   style="font-size:9px;font-weight:800">VIL</button>
        <button class="mb" id="btnCad" title="Cadastral WMS"  onclick="GIS.Layers.toggleWms('cadastral')" style="font-size:9px;font-weight:800">CAD</button>
        <div class="cat-divider"></div>
        <div class="cat-hint">KSUDP Survey Parcel</div>
        <button class="mb" id="btnKCH" title="KSUDP Kochi Parcel"      onclick="GIS.Layers.toggleWms('parcelKCH')" style="font-size:9px;font-weight:800">KCH</button>
        <button class="mb" id="btnKKD" title="KSUDP Kozhikode Parcel"  onclick="GIS.Layers.toggleWms('parcelKKD')" style="font-size:9px;font-weight:800">KKD</button>
        <button class="mb" id="btnKLM" title="KSUDP Kollam Parcel"     onclick="GIS.Layers.toggleWms('parcelKLM')" style="font-size:9px;font-weight:800">KLM</button>
        <button class="mb" id="btnTCR" title="KSUDP Thrissur Parcel"   onclick="GIS.Layers.toggleWms('parcelTCR')" style="font-size:9px;font-weight:800">TCR</button>
        <button class="mb" id="btnTVM" title="KSUDP Trivandrum Parcel" onclick="GIS.Layers.toggleWms('parcelTVM')" style="font-size:9px;font-weight:800">TVM</button>
      </div>
    </div>

    <!-- DRAWING TOOL TAB -->
    <div class="tool-cat" id="cat-draw">
      <button class="cat-head" onclick="GIS.UI.toggleCat('draw')">
        <span class="cat-icon"><i class="fa-solid fa-pen-ruler"></i></span>
        <span class="cat-label">Drawing Tools</span>
        <i class="fa-solid fa-chevron-down cat-chev"></i>
      </button>
      <div class="cat-body">
        <button class="mb" id="markerBtn"  title="Save Note (Location Pin)" onclick="GIS.Draw.trigger('Marker')"> <i class="fa-solid fa-location-dot"></i></button>
        <button class="mb" id="lineBtn"    title="Draw Line"    onclick="GIS.Draw.trigger('Line')">   <i class="fa-solid fa-file-signature"></i></button>
        <button class="mb" id="polygonBtn" title="Draw Polygon" onclick="GIS.Draw.trigger('Polygon')"><i class="fa-solid fa-draw-polygon"></i></button>
        <button class="mb" id="editBtn"    title="Edit Shapes"  onclick="GIS.Draw.toggleEdit()"><i class="fa-solid fa-pen-to-square"></i></button>
        <button class="mb" id="eraseModeBtn" title="Touch Erase" onclick="GIS.Draw.toggleErase()"><i class="fa-solid fa-eraser"></i></button>
        <button class="mb" title="Clear All"  onclick="GIS.Draw.clearAll()"  style="color:var(--red)"><i class="fa-solid fa-trash-can"></i></button>
      </div>
    </div>

    <!-- GEOREFERENCE TOOL TAB -->
    <div class="tool-cat" id="cat-georef">
      <button class="cat-head" onclick="GIS.UI.toggleCat('georef')">
        <span class="cat-icon"><i class="fa-solid fa-map-location-dot"></i></span>
        <span class="cat-label">Georeference Tools</span>
        <i class="fa-solid fa-chevron-down cat-chev"></i>
      </button>
      <div class="cat-body">
        <label class="mb cat-full" id="fmbLoadLabel" title="Load FMB Image/PDF" style="width:100%;height:32px;gap:6px;font-size:10.5px;font-weight:700;background:var(--green);color:#fff;">
          <i class="fa-solid fa-image"></i> Load FMB
          <input type="file" id="uploadFMB" accept=".jpg,.jpeg,.png,.pdf" style="display:none" />
        </label>

        <div id="fmbTools" style="display:none;flex-wrap:wrap;gap:6px;width:100%">
          <div class="cat-divider"></div>
          <button class="mb cat-full" id="touchMoveBtn" title="Touch Move FMB" onclick="GIS.FMB.toggleTouch()" style="width:100%;gap:6px;font-size:10.5px;font-weight:700"><i class="fa-solid fa-hand-pointer"></i> Touch Move</button>

          <div class="cat-hint">Position</div>
          <div class="mb-fmb-row" style="justify-content:center">
            <button class="mb" onclick="GIS.FMB.adjust('up')">↑</button>
          </div>
          <div class="mb-fmb-row" style="justify-content:center">
            <button class="mb" onclick="GIS.FMB.adjust('left')">←</button>
            <button class="mb" onclick="GIS.FMB.adjust('down')">↓</button>
            <button class="mb" onclick="GIS.FMB.adjust('right')">→</button>
          </div>

          <div class="cat-hint">Scale / Rotate</div>
          <button class="mb" title="Zoom In"  onclick="GIS.FMB.adjust('zoomin')"><i class="fa-solid fa-plus"></i></button>
          <button class="mb" title="Zoom Out" onclick="GIS.FMB.adjust('zoomout')"><i class="fa-solid fa-minus"></i></button>
          <button class="mb" title="Rotate Left"  onclick="GIS.FMB.adjust('rotL')"><i class="fa-solid fa-rotate-left"></i></button>
          <button class="mb" title="Rotate Right" onclick="GIS.FMB.adjust('rotR')"><i class="fa-solid fa-rotate-right"></i></button>

          <div class="cat-hint">Opacity</div>
          <div class="slider-wrap cat-full">
            <input type="range" id="fmbOpacity" class="vslider" min="0.1" max="1" step="0.05" value="0.6" style="width:100%" />
          </div>

          <div class="cat-divider"></div>
          <button class="mb cat-full" title="Remove FMB" onclick="GIS.FMB.remove()" style="width:100%;gap:6px;font-size:10.5px;font-weight:700;background:rgba(220,38,38,.14);color:var(--red)"><i class="fa-solid fa-trash"></i> Remove FMB</button>
        </div>
      </div>
    </div>

    <!-- NAVIGATION TOOL TAB -->
    <div class="tool-cat" id="cat-nav">
      <button class="cat-head" onclick="GIS.UI.toggleCat('nav')">
        <span class="cat-icon"><i class="fa-solid fa-route"></i></span>
        <span class="cat-label">Navigation Tools</span>
        <i class="fa-solid fa-chevron-down cat-chev"></i>
      </button>
      <div class="cat-body">
        <div class="cat-hint">Tap a point on the map, or a saved note's Navigate button, to route from your live location.</div>
        <button class="mb cat-full" id="routeModeBtn" title="Route Planner" onclick="GIS.Draw.toggleRouteMode()" style="width:100%;gap:6px;font-size:10.5px;font-weight:700"><i class="fa-solid fa-route"></i> Route Planner</button>
      </div>
    </div>

  </div>
</div>

<div class="ctrl-panel hud" id="ctrlPanel">
  <button class="btn btn-export" onclick="GIS.IO.exportKML()"><i class="fa-solid fa-file-export"></i>Save KML</button>
  <button class="btn btn-export" onclick="GIS.IO.exportKMZ()"><i class="fa-solid fa-file-zipper"></i>Save KMZ</button>
  <button class="btn btn-export" onclick="GIS.IO.exportGeoImage()"><i class="fa-solid fa-image"></i>Geo-JPEG</button>
  <label class="btn btn-import">
    <i class="fa-solid fa-file-import"></i>Load KML
    <input type="file" id="uploadFile" accept=".kml,.json,.geojson" style="display:none" />
  </label>
</div>

<div id="toast-root"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Confirm</div>
    <div class="modal-body"  id="modalBody">Are you sure?</div>
    <div class="modal-actions">
      <button class="modal-btn cancel"  id="modalCancel">Cancel</button>
      <button class="modal-btn confirm" id="modalConfirm">Confirm</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="https://unpkg.com/@mapbox/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

<!-- External Script -->
<script src="script.js"></script>
</body>
</html>
