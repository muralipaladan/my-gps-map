<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sodestus — Mobile GIS & FMB Tool</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div id="map"></div>
<div id="statusText">CAD</div>

<!-- TOP SEARCH BAR -->
<div class="topbar">
  <button class="more-btn" id="moreBtn" onclick="GIS.UI.toggleMore()" title="ടൂളുകൾ">
    <i class="fa-solid fa-bars"></i>
  </button>
  
  <div class="searchbar" id="searchBar">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" id="searchInput" placeholder="Search place or Lat, Lng (eg: 11.19, 76.22)..." autocomplete="off" />
    <button id="searchBtn" onclick="GIS.MapCtrl.searchLocation()" title="Search"><i class="fa-solid fa-arrow-right"></i></button>
  </div>
</div>

<!-- VERTICAL TOOL RIBBON -->
<div class="tool-ribbon" id="toolRibbon">
  
  <!-- MAIN MENU PAGE -->
  <div class="ribbon-page active" id="pageMain">
    <button class="mb" onclick="GIS.UI.showRibbonPage('draw')" title="ഡ്രോയിംഗ്"><i class="fa-solid fa-pen-ruler"></i></button>
    <button class="mb" onclick="GIS.UI.showRibbonPage('fmb')" id="btnFMBPage" title="FMB ടൂളുകൾ"><i class="fa-solid fa-sliders"></i></button>
    <button class="mb" onclick="GIS.UI.showRibbonPage('layers')" title="ലെയറുകൾ"><i class="fa-solid fa-layer-group"></i></button>
    <div class="rb-divider"></div>
    <label class="mb on-green" title="FMB അപ്‌ലോഡ്">
      <i class="fa-solid fa-file-image"></i>
      <input type="file" id="uploadFMB" accept=".jpg,.png,.jpeg" onchange="GIS.FMB.handleFileUpload(event)" style="display:none" />
    </label>
    <button class="mb" id="routeModeBtn" onclick="GIS.GPS.toggle()" title="GPS Tracking"><i class="fa-solid fa-location-arrow"></i></button>
  </div>

  <!-- DRAWING SUB-TOOLS PAGE -->
  <div class="ribbon-page" id="pageDraw">
    <button class="mb back-btn" onclick="GIS.UI.showRibbonPage('main')" title="Back"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="rb-divider"></div>
    <button class="mb" onclick="GIS.Draw.trigger('Marker')"><i class="fa-solid fa-location-dot"></i></button>
    <button class="mb" onclick="GIS.Draw.trigger('Line')"><i class="fa-solid fa-slash"></i></button>
    <button class="mb" onclick="GIS.Draw.trigger('Polygon')"><i class="fa-solid fa-draw-polygon"></i></button>
    <button class="mb" style="color:var(--red);" onclick="GIS.Draw.clearAll()"><i class="fa-solid fa-trash-can"></i></button>
  </div>

  <!-- FMB PRECISION ADJUSTMENT PAGE -->
  <div class="ribbon-page" id="pageFMB">
    <button class="mb back-btn" onclick="GIS.UI.showRibbonPage('main')" title="Back"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="rb-divider"></div>

    <!-- Rotation Precision Selector -->
    <select id="rotStepSelect" class="step-select" onchange="GIS.FMB.setRotStep(this.value)" title="Rotation Precision">
      <option value="0.001">0.001°</option>
      <option value="0.01">0.01°</option>
      <option value="0.1" selected>0.1°</option>
      <option value="1">1.0°</option>
    </select>

    <!-- Movement Precision Selector -->
    <select id="moveStepSelect" class="step-select" onchange="GIS.FMB.setMoveStep(this.value)" title="Movement Accuracy">
      <option value="0.0000005">Ultra (0.05m)</option>
      <option value="0.000001">Fine (0.1m)</option>
      <option value="0.00001" selected>Medium (1m)</option>
      <option value="0.0001">Coarse (10m)</option>
    </select>

    <div class="rb-divider"></div>
    <button class="mb" onclick="GIS.FMB.adjust('up')" title="Shift Up"><i class="fa-solid fa-caret-up"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('down')" title="Shift Down"><i class="fa-solid fa-caret-down"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('left')" title="Shift Left"><i class="fa-solid fa-caret-left"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('right')" title="Shift Right"><i class="fa-solid fa-caret-right"></i></button>
    <div class="rb-divider"></div>
    <button class="mb" onclick="GIS.FMB.adjust('rotL')" title="Rotate Anti-Clockwise"><i class="fa-solid fa-rotate-left"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('rotR')" title="Rotate Clockwise"><i class="fa-solid fa-rotate-right"></i></button>
    <div class="rb-divider"></div>
    <button class="mb" onclick="GIS.FMB.adjust('zoomin')" title="Scale Up"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('zoomout')" title="Scale Down"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('opPlus')" title="Increase Opacity"><i class="fa-solid fa-eye"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('opMinus')" title="Decrease Opacity"><i class="fa-solid fa-eye-slash"></i></button>
    <button class="mb" style="color:var(--red);" onclick="GIS.FMB.remove()" title="Delete FMB"><i class="fa-solid fa-trash"></i></button>
  </div>

  <!-- LAYERS PAGE -->
  <div class="ribbon-page" id="pageLayers">
    <button class="mb back-btn" onclick="GIS.UI.showRibbonPage('main')" title="Back"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="rb-divider"></div>
    <button class="mb" onclick="GIS.Layers.setBase('hybrid')">HYB</button>
    <button class="mb" onclick="GIS.Layers.setBase('osm')">OSM</button>
    <div class="rb-divider"></div>
    <button class="mb" id="btnCad" onclick="GIS.Layers.toggleCadastral()">CAD</button>
  </div>

</div>

<!-- ZOOM CONTROLS -->
<div class="zoom-ctrl">
  <button onclick="GIS.MapCtrl.zoomIn()"><i class="fa-solid fa-plus"></i></button>
  <button onclick="GIS.MapCtrl.zoomOut()"><i class="fa-solid fa-minus"></i></button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
<script src="script.js"></script>

</body>
</html>
