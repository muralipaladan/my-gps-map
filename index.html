<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sodestus — Professional Mobile GIS</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div id="map"></div>
<div id="zoomBox"></div>

<!-- ORANGE LINES & BLACK SURVEY NUMBERS FILTER -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="orangeRecolor" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="
      0.898 0 0 0 0
      0.357 0 0 0 0
      0.141 0 0 0 0
      0     0 0 1 0" />
  </filter>

  <!-- BLACK SURVEY LINES & BLACK NUMBERS WITH WHITE BUFFER (HALO) FILTER -->
  <filter id="surveyInk" color-interpolation-filters="sRGB">
    <feFlood flood-color="#ffffff" result="floodWhite"/>
    <feFlood flood-color="#000000" result="floodBlack"/>
    <feMorphology in="SourceAlpha" operator="dilate" radius="1" result="dilA"/>
    <feComposite in="floodWhite" in2="dilA" operator="in" result="halo"/>
    <feComposite in="floodBlack" in2="SourceAlpha" operator="in" result="ink"/>
    <feMerge>
      <feMergeNode in="halo"/>
      <feMergeNode in="ink"/>
    </feMerge>
  </filter>
</svg>

<!-- TOP SEARCH BAR -->
<div class="topbar">
  <button class="more-btn" id="moreBtn" onclick="GIS.UI.toggleMore()" title="ടൂളുകൾ">
    <i class="fa-solid fa-bars"></i>
  </button>
  
  <div class="searchbar" id="searchBar">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" id="searchInput" placeholder="Search place or Lat, Lng (eg: 11.19, 76.22)..." autocomplete="off" />
    <button id="micBtn" onclick="GIS.Voice.toggle()" title="Voice search"><i class="fa-solid fa-microphone"></i></button>
    <button id="searchBtn" title="Search"><i class="fa-solid fa-arrow-right"></i></button>
  </div>
</div>

<div id="statusText">CAD</div>

<!-- VERTICAL TOOL RIBBON -->
<div class="tool-ribbon" id="toolRibbon">
  
  <!-- MAIN MENU PAGE -->
  <div class="ribbon-page active" id="pageMain">
    <button class="mb" onclick="GIS.UI.showRibbonPage('draw')" title="ഡ്രോയിംഗ് ടൂളുകൾ"><i class="fa-solid fa-pen-ruler"></i></button>
    <button class="mb" onclick="GIS.UI.showRibbonPage('fmb')" id="btnFMBPage" title="FMB ടൂളുകൾ"><i class="fa-solid fa-sliders"></i></button>
    <button class="mb" onclick="GIS.UI.showRibbonPage('layers')" title="ലെയറുകൾ"><i class="fa-solid fa-layer-group"></i></button>
    <div class="rb-divider"></div>
    <label class="mb on-green" title="FMB അപ്‌ലോഡ്"><i class="fa-solid fa-file-image"></i><input type="file" id="uploadFMB" accept=".jpg,.png,.pdf" style="display:none" /></label>
    <button class="mb" id="routeModeBtn" onclick="GIS.Draw.toggleRouteMode()" title="നാവിഗേറ്റ്"><i class="fa-solid fa-location-arrow"></i></button>
  </div>

  <!-- DRAWING SUB-TOOLS PAGE -->
  <div class="ribbon-page" id="pageDraw">
    <button class="mb back-btn" onclick="GIS.UI.showRibbonPage('main')" title="Back"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="rb-divider"></div>
    <button class="mb" id="markerBtn" onclick="GIS.Draw.trigger('Marker')"><i class="fa-solid fa-location-dot"></i></button>
    <button class="mb" id="lineBtn" onclick="GIS.Draw.trigger('Line')"><i class="fa-solid fa-slash"></i></button>
    <button class="mb" id="polygonBtn" onclick="GIS.Draw.trigger('Polygon')"><i class="fa-solid fa-draw-polygon"></i></button>
    <button class="mb" id="editBtn" onclick="GIS.Draw.toggleEdit()"><i class="fa-solid fa-pen-to-square"></i></button>
    <button class="mb" id="eraseModeBtn" onclick="GIS.Draw.toggleErase()"><i class="fa-solid fa-eraser"></i></button>
    <button class="mb" style="color:var(--red);" onclick="GIS.Draw.clearAll()"><i class="fa-solid fa-trash-can"></i></button>
  </div>

  <!-- FMB ADJUSTMENT SUB-TOOLS PAGE -->
  <div class="ribbon-page" id="pageFMB">
    <button class="mb back-btn" onclick="GIS.UI.showRibbonPage('main')" title="Back"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="rb-divider"></div>
    <button class="mb" id="touchMoveBtn" onclick="GIS.FMB.toggleTouch()"><i class="fa-solid fa-hand"></i></button>
    <div class="rb-divider"></div>
    <button class="mb-label" onclick="GIS.FMB.openStepSlider('move')" title="Move step slider"><i class="fa-solid fa-arrows-up-down-left-right"></i><span>MOVE</span></button>
    <button class="mb-label rot" onclick="GIS.FMB.openStepSlider('rot')" title="Rotation step slider"><i class="fa-solid fa-rotate-right"></i><span>ROT</span></button>
    <button class="mb-label zoom" onclick="GIS.FMB.openStepSlider('zoom')" title="Zoom step slider"><i class="fa-solid fa-up-right-and-down-left-from-center"></i><span>ZOOM</span></button>
    <div class="rb-divider"></div>
    <button class="mb" onclick="GIS.FMB.adjust('up')"><i class="fa-solid fa-caret-up"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('down')"><i class="fa-solid fa-caret-down"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('left')"><i class="fa-solid fa-caret-left"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('right')"><i class="fa-solid fa-caret-right"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('zoomin')"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('zoomout')"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('rotL')"><i class="fa-solid fa-rotate-left"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('rotR')"><i class="fa-solid fa-rotate-right"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('opPlus')"><i class="fa-solid fa-eye"></i></button>
    <button class="mb" onclick="GIS.FMB.adjust('opMinus')"><i class="fa-solid fa-eye-slash"></i></button>
    <button class="mb" style="color:var(--red);" onclick="GIS.FMB.remove()"><i class="fa-solid fa-trash"></i></button>
  </div>

  <!-- LAYERS SUB-TOOLS PAGE -->
  <div class="ribbon-page" id="pageLayers">
    <button class="mb back-btn" onclick="GIS.UI.showRibbonPage('main')" title="Back"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="rb-divider"></div>
    <button class="mb basetile" data-base="hybrid" onclick="GIS.Layers.setBase('hybrid')"><span class="bt-hybrid"></span></button>
    <button class="mb basetile" data-base="road" onclick="GIS.Layers.setBase('road')"><span class="bt-road"></span></button>
    <button class="mb basetile" data-base="osm" onclick="GIS.Layers.setBase('osm')"><span class="bt-osm"></span></button>
    <div class="rb-divider"></div>
    <button class="mb" id="btnVil" onclick="GIS.Layers.toggleWms('village')">VIL</button>
    <button class="mb" id="btnCad" onclick="GIS.Layers.toggleWms('cadastral')">CAD</button>
    <button class="mb" id="btnKCH" onclick="GIS.Layers.toggleWms('parcelKCH')">KCH</button>
    <button class="mb" id="btnKKD" onclick="GIS.Layers.toggleWms('parcelKKD')">KKD</button>
    <button class="mb" id="btnKLM" onclick="GIS.Layers.toggleWms('parcelKLM')">KLM</button>
    <button class="mb" id="btnTCR" onclick="GIS.Layers.toggleWms('parcelTCR')">TCR</button>
    <button class="mb" id="btnTVM" onclick="GIS.Layers.toggleWms('parcelTVM')">TVM</button>
    <div class="rb-divider"></div>
    <button class="mb" id="btnInk" onclick="GIS.Layers.toggleInk()" title="Survey number: Black + White buffer">INK</button>
  </div>

</div>

<!-- FMB STEP SLIDER PANEL (appears beside ribbon on icon tap) -->
<div class="step-slider-panel" id="stepSliderPanel">
  <div class="ssp-head">
    <i class="fa-solid fa-sliders" id="sspIcon"></i>
    <span class="ssp-title" id="sspTitle">STEP</span>
  </div>
  <input type="range" id="stepSlider" min="0.1" max="5" step="0.1" value="1">
  <div class="ssp-scale"><span>−</span><span>+</span></div>
  <div class="ssp-value" id="sspValue">1.0 m</div>
</div>

<!-- ZOOM CONTROLS -->
<div class="zoom-ctrl">
  <button onclick="GIS.MapCtrl.zoomIn()" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
  <button onclick="GIS.MapCtrl.zoomOut()" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
</div>

<!-- BOTTOM RIGHT CONTROLS -->
<div class="fab-stack">
  <button class="fab-pill icon-only" onclick="document.getElementById('exportMenu').classList.toggle('active')" title="ഫീൽഡ് റിപ്പോർട്ട്">
    <i class="fa-solid fa-folder"></i>
  </button>
  <button class="fab-pill icon-only" id="gpsBtn" onclick="GIS.GPS.toggle()" title="GPS On/Off">
    <i class="fa-solid fa-location-crosshairs"></i>
  </button>
</div>

<!-- Export/Save Popup Menu -->
<div class="export-menu" id="exportMenu">
  <button class="btn btn-export" onclick="GIS.IO.exportKMZ(); document.getElementById('exportMenu').classList.remove('active');">
    <i class="fa-solid fa-file-zipper"></i> Save KMZ
  </button>
  <label class="btn btn-import" style="margin-top:4px; justify-content:center;">
    <i class="fa-solid fa-file-import"></i> Load KML / KMZ
    <input type="file" id="uploadFile" accept=".kml,.kmz,.json,.geojson" style="display:none" />
  </label>
  <div class="export-credit">Muraleedharan P<br>Ph 9400849115</div>
</div>

<div id="toast-root"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Confirm</div>
    <div class="modal-body" id="modalBody">Are you sure?</div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="modalCancel">Cancel</button>
      <button class="modal-btn confirm" id="modalConfirm">Confirm</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://unpkg.com/@mapbox/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
<script src="script.js"></script>

</body>
</html>
